# YOLO26n baseline configuration (no custom modules)

nc: 9
end2end: True
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0: Stem (640→320)
  - [-1, 1, Conv, [128, 3, 2]]                   # 1: (320→160)
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2: P2/4 (160²)
  - [-1, 1, Conv, [256, 3, 2]]                   # 3: (160→80)
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4: P3/8 (80²)
  - [-1, 1, Conv, [512, 3, 2]]                   # 5: (80→40)
  - [-1, 2, C3k2, [512, True]]                   # 6: P4/16 (40²)
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7: (40→20)
  - [-1, 2, C3k2, [1024, True]]                  # 8: (20²)
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 9: SPPF (20²)
  - [-1, 2, C2PSA, [1024]]                       # 10: P5/32 (20²)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11: FPN upsample (20→40)
  - [[-1, 6], 1, Concat, [1]]                    # 12: Concat P5↑ + P4
  - [-1, 2, C3k2, [512, True]]                   # 13: FPN P4 (40²)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14: FPN upsample (40→80)
  - [[-1, 4], 1, Concat, [1]]                    # 15: Concat P4↑ + P3
  - [-1, 2, C3k2, [256, True]]                   # 16: FPN P3 (80²)

  - [-1, 1, Conv, [256, 3, 2]]                   # 17: PAN downsample (80→40)
  - [[-1, 13], 1, Concat, [1]]                   # 18: Concat P3↓ + P4
  - [-1, 2, C3k2, [512, True]]                   # 19: PAN P4 (40²)

  - [-1, 1, Conv, [512, 3, 2]]                   # 20: PAN downsample (40→20)
  - [[-1, 10], 1, Concat, [1]]                   # 21: Concat P4↓ + P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 22: PAN P5 (20²)

  - [[16, 19, 22], 1, Detect, [nc]]              # 23: Detect (P3, P4, P5)
